# @package _global_
defaults:
  - override /algorithm: fedavg
  - override /attack: badnets
  - override /model: resnet18
  - override /dataset: cifar10

# Badnets 记为 vanilla, 无防御 (FedAvg) 记为 vanilla.
# NOTE: config.yaml 末尾的 experiment_name=${algorithm.name} 会覆盖此处,
# 启动时需 CLI 显式传入 experiment_name / logging.name / logging.project.

client:
  lr: 0.1

training:
  clients_fraction: 0.1
  lr_schedule:
    enabled: false
    name: warmup_cosine
    warmup_ratio: 0.1
    min_lr: 5.0e-5
    warmup_start_lr: 0.0

attack:
  enabled: true
  malicious_fraction: 0.1
  per_round_fraction: 0.1
  strategies:
    - name: badnets
      fraction: 1.0
      params: {}

logging:
  use_wandb: true
  use_csv: true
  console_metrics: true

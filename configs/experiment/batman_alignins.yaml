# @package _global_
defaults:
  - override /algorithm: alignins
  - override /attack: batman
  - override /model: resnet18
  - override /dataset: cifar10

# NOTE: config.yaml 末尾的 experiment_name=${algorithm.name} 会覆盖此处,
# 启动时需 CLI 显式传入 experiment_name / logging.name / logging.project.

client:
  lr: 0.1

training:
  clients_fraction: 0.2
  lr_schedule:
    enabled: true
    name: warmup_cosine
    warmup_ratio: 0.1
    min_lr: 1.0e-5
    warmup_start_lr: 0.0

attack:
  enabled: true
  malicious_fraction: 0.2
  per_round_fraction: 0.2
  strategies:
    - name: batman
      fraction: 1.0
      params: {}

logging:
  use_wandb: true
  use_csv: true
  console_metrics: true
